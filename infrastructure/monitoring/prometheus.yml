global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: controller
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['atlas-controller:3000']
    # Stable game instance labels take precedence over scrape target identity.
    honor_labels: true
  - job_name: host
    static_configs:
      - targets: ['atlas-node-exporter:9100']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
